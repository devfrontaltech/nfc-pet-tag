<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <img class="hero-img" id="hero-img" alt="">
  <div class="hero-overlay"></div>
  <div class="paw-top">🐾</div>
  <div class="hero-badge" id="hero-badge" style="display:none">✓ Con microchip</div>
  <div class="hero-info">
    <div class="hero-name" id="hero-name"></div>
    <div class="hero-sub" id="hero-sub"></div>
    <div class="hero-chips" id="hero-chips"></div>
  </div>
</div>

<div class="content">

  <div class="stats-strip" id="stats-strip"></div>

  <div class="info-row" id="info-row" style="display:none">
    <div class="info-mini" id="vet-card" style="display:none">
      <div class="info-mini-label">🏥 Veterinario</div>
      <div class="info-mini-val" id="vet-nombre"></div>
      <div class="info-mini-sub" id="vet-telefono"></div>
    </div>
    <div class="info-mini" id="chip-card" style="display:none">
      <div class="info-mini-label">🔖 Microchip</div>
      <div class="info-mini-val" id="chip-numero" style="font-size:13px;letter-spacing:-0.5px"></div>
    </div>
  </div>

  <div class="card" id="food-card" style="display:none">
    <div class="card-title">
      <div class="card-title-icon" style="background:#DCE9DC">🍖</div>
      Alimentación diaria
    </div>
    <div class="food-grid" id="food-grid"></div>
  </div>

  <div class="card" id="allergy-card" style="display:none">
    <div class="card-title">
      <div class="card-title-icon" style="background:#FFE8E0">⚠️</div>
      Alergias conocidas
    </div>
    <div class="allergy-list" id="allergy-list"></div>
  </div>

  <div class="card" id="loc-card" style="display:none">
    <div class="card-title">
      <div class="card-title-icon" style="background:#EDD9C4">📍</div>
      Casa de <span id="loc-name"></span>
    </div>
    <div class="location-map">
      <iframe id="map-iframe" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Ubicación"></iframe>
    </div>
    <div class="location-address">
      <div class="location-icon">🏡</div>
      <div class="location-text"><strong id="loc-direccion"></strong></div>
    </div>
  </div>

  <div class="card" id="notas-card" style="display:none; background: #FFF8EC; border: 1px solid #F5E4B8;">
    <div class="card-title" style="margin-bottom:10px">
      <div class="card-title-icon" style="background:#F5E4B8">📝</div>
      Notas especiales
    </div>
    <p id="notas" style="font-size:14px; color:var(--text-main); line-height:1.7"></p>
  </div>

</div>

<div class="footer">
  Hecho con 🐾 para <span id="footer-nombre"></span>
</div>

<div class="btn-whatsapp-wrapper" id="contact-bar" style="display:none">
  <div class="btn-row">
    <a class="btn-whatsapp" id="btn-whatsapp" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
      Contactar por WhatsApp
    </a>
    <a class="btn-call" id="btn-call" href="#">📞</a>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
